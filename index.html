<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>BROWN POS Guide</title>
<meta name="description" content="The BROWN POS guide: system design, hosting, database and features. Log in to read it.">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<!-- No content is stored in this page: everything is loaded after login. -->
<div class="wrap">
  <nav class="rail" aria-label="Contents">
    <div class="brand"><i></i>BROWN POS Guide<button type="button" class="theme-btn" data-theme-btn></button></div>
    <div class="pages" id="pages"></div>
    <label for="q" style="position:absolute;left:-9999px">Search this page</label>
    <input id="q" class="search" type="search" placeholder="Search this page…" autocomplete="off">
    <div class="top" id="toc"></div>
    <div class="me" id="me" hidden></div>
  </nav>
  <main id="main"><div class="loading">Loading…</div></main>
</div>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/vendor/mermaid.min.js"></script>
<script src="assets/render.js"></script>
<script>
(function () {
  var R = window.guideRender, esc = R.esc, $ = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(location.search), slug = params.get('p') || '', site;

  function get(path) {
    return fetch('api/' + path, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.message || 'Error ' + r.status); e.status = r.status; throw e; } return d; });
    });
  }
  function toLogin() { location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search + location.hash)); }
  function problem(e) { $('#main').innerHTML = '<div class="problem">Could not load the guide: ' + esc(e.message) + '</div>'; }

  get('site').then(function (d) {
    site = d;
    var me = d.admin;
    $('#me').hidden = false;
    $('#me').innerHTML = '<div><b>' + esc(me.name || me.email) + '</b><span class="role">' + esc(d.roles[me.role] || me.role) + '</span></div>' +
      '<div class="links">' + (me.permissions.indexOf('edit') >= 0 ? '<a href="admin/">Edit in the portal</a>' : '') + '<button type="button" id="logout">Log out</button></div>';
    $('#logout').addEventListener('click', function () {
      fetch('api/logout', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Guide': '1' }, body: '{}' }).then(function () { location.replace('login.html'); });
    });
    return get('page?slug=' + encodeURIComponent(slug)).then(draw);
  }).catch(function (e) { if (e.status === 401) toLogin(); else problem(e); });

  function draw(d) {
    var page = d.page;
    document.title = page.title + ' · BROWN POS Guide';
    $('#pages').innerHTML = site.pages.map(function (p) {
      return '<a href="?p=' + encodeURIComponent(p.slug) + '"' + (p.id === page.id ? ' class="on" aria-current="page"' : '') + '>' + esc(p.title) + '</a>';
    }).join('');
    $('#toc').innerHTML = d.blocks.map(function (b) { return '<a href="#' + esc(b.anchor) + '">' + esc(b.title) + '</a>'; }).join('');
    // menu links scroll to the block itself (diagrams can contain elements with the same id)
    $('#toc').onclick = function (e) {
      var l = e.target.closest('a'); if (!l) return;
      var el = document.querySelector('#main > section[id="' + CSS.escape(l.getAttribute('href').slice(1)) + '"]');
      if (el) { e.preventDefault(); el.scrollIntoView({ behavior: 'smooth' }); history.replaceState(null, '', l.getAttribute('href')); }
    };
    var main = $('#main'); main.innerHTML = '';
    var head = document.createElement('header'); head.className = 'page-head';
    head.innerHTML = '<h1>' + esc(page.title) + '</h1>';
    if (page.intro) { var intro = R.md(page.intro, 'intro'); head.appendChild(intro); }
    main.appendChild(head);
    d.blocks.forEach(function (b) { main.appendChild(R.block(b)); });
    var up = document.createElement('p'); up.className = 'updated';
    up.textContent = 'Last updated ' + new Date(d.updatedAt).toLocaleString();
    main.appendChild(up);
    R.diagrams(main);
    if (location.hash) { var el = main.querySelector(':scope > section[id="' + CSS.escape(decodeURIComponent(location.hash.slice(1))) + '"]') || document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); }
  }

  // search: hides blocks, cards, tables and terms that do not contain every word typed
  $('#q').addEventListener('input', function () {
    var words = this.value.toLowerCase().split(/\s+/).filter(Boolean);
    var has = function (el) { var t = (el.getAttribute('data-search') || el.textContent).toLowerCase(); return words.every(function (w) { return t.indexOf(w) >= 0; }); };
    var toggle = function (el, show) { el.classList.toggle('hidden-by-search', !show); return show; };
    [].forEach.call(document.querySelectorAll('#main > section'), function (s) {
      if (!words.length) { [].forEach.call(s.querySelectorAll('.hidden-by-search'), function (x) { x.classList.remove('hidden-by-search'); }); toggle(s, true); return; }
      var parts = s.querySelectorAll('.fcard, .tcard, .term, .enumcard, .flow, .query');
      if (parts.length) {
        var any = false;
        [].forEach.call(parts, function (p) { if (toggle(p, has(p))) any = true; });
        [].forEach.call(s.querySelectorAll('.domain, .tgroup'), function (g) { toggle(g, !!g.querySelector('.tcard:not(.hidden-by-search), .term:not(.hidden-by-search)')); });
        toggle(s, any || has(s.querySelector('.dhead')));
      } else toggle(s, has(s));
    });
  });
})();
</script>
</body>
</html>
