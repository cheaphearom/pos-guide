<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>BROWN POS Guide</title>
<meta name="description" content="The BROWN POS guide: system design, hosting, database and features. Log in to read it.">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<!-- No content is stored in this page: everything is loaded after login. -->
<div class="wrap">
  <nav class="rail" aria-label="Contents">
    <div class="brand"><i></i>BROWN POS Guide<button type="button" class="theme-btn" data-theme-btn></button></div>
    <div class="pages" id="pages"></div>
    <label for="q" style="position:absolute;left:-9999px">Search this page</label>
    <input id="q" class="search" type="search" placeholder="Search this page…" autocomplete="off">
    <div class="top" id="toc"></div>
    <div class="me" id="me" hidden></div>
    <p class="copyright">© 2026 Chea Phearom. All rights reserved.</p>
  </nav>
  <main id="main"><div class="loading">Loading…</div></main>
</div>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/vendor/mermaid.min.js"></script>
<script src="assets/render.js"></script>
<script>
(function () {
  var R = window.guideRender, esc = R.esc, $ = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(location.search), slug = params.get('p') || '', site;

  function get(path) {
    return fetch('api/' + path, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.message || 'Error ' + r.status); e.status = r.status; throw e; } return d; });
    });
  }
  function toLogin() { location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search + location.hash)); }
  function problem(e) { $('#main').innerHTML = '<div class="problem">Could not load the guide: ' + esc(e.message) + '</div>'; }

  get('site').then(function (d) {
    site = d;
    var me = d.admin;
    $('#me').hidden = false;
    $('#me').innerHTML = '<div><b>' + esc(me.name || me.email) + '</b><span class="role">' + esc(d.roles[me.role] || me.role) + '</span></div>' +
      '<div class="links">' + (me.permissions.indexOf('edit') >= 0 ? '<a href="admin/">Edit in the portal</a>' : '') + '<button type="button" id="logout">Log out</button></div>';
    $('#logout').addEventListener('click', function () {
      fetch('api/logout', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Guide': '1' }, body: '{}' }).then(function () { location.replace('login.html'); });
    });
    return get('page?slug=' + encodeURIComponent(slug)).then(draw);
  }).catch(function (e) { if (e.status === 401) toLogin(); else problem(e); });

  function draw(d) {
    var page = d.page;
    document.title = page.title + ' · BROWN POS Guide';
    $('#pages').innerHTML = site.pages.map(function (p) {
      return '<a href="?p=' + encodeURIComponent(p.slug) + '"' + (p.id === page.id ? ' class="on" aria-current="page"' : '') + '>' + esc(p.title) + '</a>';
    }).join('');
    drawToc(d.blocks);
    // menu links scroll to the block itself (diagrams can contain elements with the same id)
    $('#toc').onclick = function (e) {
      var l = e.target.closest('a'); if (!l) return;
      var el = document.querySelector('#main > section[id="' + CSS.escape(l.getAttribute('href').slice(1)) + '"]');
      if (el) {
        e.preventDefault(); el.scrollIntoView({ behavior: 'smooth' }); history.replaceState(null, '', l.getAttribute('href'));
        // the clicked part stays highlighted while the page scrolls to it
        window.tocHold = Date.now() + 1200;
        [].forEach.call($('#toc').querySelectorAll('a.on'), function (x) { x.classList.remove('on'); }); l.classList.add('on');
      }
    };
    var main = $('#main'); main.innerHTML = '';
    var head = document.createElement('header'); head.className = 'page-head';
    head.innerHTML = '<h1>' + esc(page.title) + '</h1>';
    if (page.intro) { var intro = R.md(page.intro, 'intro'); head.appendChild(intro); }
    main.appendChild(head);
    d.blocks.forEach(function (b) { main.appendChild(R.block(b)); });
    // quick reference card layout: every ### heading starts a box; the boxes sit in a grid (one landscape sheet per block)
    main.classList.toggle('layout-card', page.layout === 'card');
    if (page.layout === 'card') [].forEach.call(main.querySelectorAll(':scope > section > .prose'), function (pr) {
      var box = null, kids = [].slice.call(pr.childNodes), grid = document.createElement('div'); grid.className = 'qgrid';
      kids.forEach(function (n) {
        if (n.nodeType === 1 && n.tagName === 'H3') { box = document.createElement('div'); box.className = 'qcard'; grid.appendChild(box); }
        if (box) box.appendChild(n);
      });
      if (grid.children.length) pr.appendChild(grid);
    });
    if (page.layout === 'card') {
      var pb = document.createElement('div'); pb.className = 'tickbar no-print';
      pb.innerHTML = '<b>Print it for the counter: one landscape sheet per card.</b><span class="sp"></span><button type="button" class="btn-lite">Print</button>';
      pb.querySelector('button').onclick = function () { window.print(); };
      head.appendChild(pb);
    }
    var up = document.createElement('p'); up.className = 'updated';
    up.textContent = 'Last updated ' + new Date(d.updatedAt).toLocaleString();
    main.appendChild(up);
    var toHash = function () { if (!location.hash) return; var id = decodeURIComponent(location.hash.slice(1)); var el = main.querySelector(':scope > section[id="' + CSS.escape(id) + '"]') || document.getElementById(id); if (el) el.scrollIntoView(); };
    toHash();
    // diagrams above the linked part change its place when drawn: go there again, unless the reader has moved already
    var moved = false, mark = function () { moved = true; };
    ['wheel', 'touchmove', 'keydown', 'mousedown'].forEach(function (t) { addEventListener(t, mark, { once: true, passive: true }); });
    R.diagrams(main).then(function () { if (!moved) toHash(); });
    ticks(page, head);
  }

  // Menu of the page's parts. Titles like "Cashier: sell an item" are grouped under "Cashier" (a group that opens
  // and closes, with the short names inside) when two or more parts in a row share the same word before ":".
  function drawToc(blocks) {
    var groups = [];
    blocks.forEach(function (b) {
      var m = /^([^:]{1,24}):\s+(.+)$/.exec(b.title), key = m ? m[1].trim() : null, last = groups[groups.length - 1];
      if (key && last && last.key === key) last.items.push({ b: b, short: m[2] });
      else groups.push({ key: key, items: [{ b: b, short: m ? m[2] : b.title }] });
    });
    var link = function (it, short) {
      var t = short ? it.short.charAt(0).toUpperCase() + it.short.slice(1) : it.b.title;
      return '<a href="#' + esc(it.b.anchor) + '" title="' + esc(it.b.title) + '">' + esc(t) + '</a>';
    };
    var grouped = groups.some(function (g) { return g.key && g.items.length > 1; });
    $('#toc').classList.toggle('grouped', grouped);
    $('#toc').innerHTML = groups.map(function (g) {
      if (!g.key || g.items.length < 2) return g.items.map(function (it) { return link(it, false); }).join('');
      return '<details class="tgrp"><summary><span>' + esc(g.key) + '</span><b>' + g.items.length + '</b></summary><div>' +
        g.items.map(function (it) { return link(it, true); }).join('') + '</div></details>';
    }).join('');
    var open = function (anchor) {
      var a = anchor && $('#toc').querySelector('a[href="#' + CSS.escape(anchor) + '"]');
      var g = a && a.closest('details'); if (g) g.open = true;
      return a;
    };
    if (!open(decodeURIComponent(location.hash.slice(1))) && matchMedia('(min-width: 961px)').matches) { var first = $('#toc details'); if (first) first.open = true; }
    // the part being read (the last one whose top has passed near the top of the screen) is highlighted in the menu
    var current, ticking = false;
    var spy = function () {
      ticking = false;
      if (Date.now() < (window.tocHold || 0)) return;
      var secs = document.querySelectorAll('#main > section[id]:not(.hidden-by-search)'), at = null;
      for (var i = 0; i < secs.length; i++) { if (secs[i].getBoundingClientRect().top <= innerHeight / 3) at = secs[i]; else break; }
      var a = at && $('#toc').querySelector('a[href="#' + CSS.escape(at.id) + '"]');
      if (!a || (a === current && a.classList.contains('on'))) return;
      [].forEach.call($('#toc').querySelectorAll('a.on'), function (x) { x.classList.remove('on'); });
      current = a; a.classList.add('on');
      // only the group being read stays open, and the menu scrolls to keep the part in view (wide screens)
      var g = a.closest('details');
      [].forEach.call($('#toc').querySelectorAll('details[open]'), function (x) { if (x !== g && !$('#q').value) x.open = false; });
      if (g) g.open = true;
      var rail = $('#toc').closest('.rail');
      if (rail && rail.scrollHeight > rail.clientHeight && matchMedia('(min-width: 961px)').matches) {
        var r = a.getBoundingClientRect(), rr = rail.getBoundingClientRect();
        if (r.top < rr.top + 60 || r.bottom > rr.bottom - 60) rail.scrollTo({ top: rail.scrollTop + r.top - rr.top - rr.height / 3, behavior: 'smooth' });
      }
    };
    window.onscroll = function () { if (!ticking) { ticking = true; requestAnimationFrame(spy); } };
    setTimeout(spy, 0);
  }

  // Checklists: tick boxes (- [ ] items) can be ticked; ticks are kept in this browser only, per page, with a counter
  // per part and Print / Clear buttons. Nothing is sent to the server.
  function ticks(page, head) {
    var boxes = document.querySelectorAll('#main > section input.tick');
    if (!boxes.length) return;
    var key = 'guide.ticks.' + page.slug, saved = {};
    try { saved = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { saved = {}; }
    var secs = document.querySelectorAll('#main > section');
    var count = function () {
      var all = 0, done = 0;
      [].forEach.call(secs, function (s) {
        var b = s.querySelectorAll('input.tick'); if (!b.length) return;
        var d = [].filter.call(b, function (x) { return x.checked; }).length; all += b.length; done += d;
        var c = s.querySelector('.tickcount'); if (!c) { c = document.createElement('span'); c.className = 'dcount tickcount'; s.querySelector('.dhead').appendChild(c); }
        c.textContent = d + ' / ' + b.length + ' done'; c.classList.toggle('all', d === b.length);
      });
      bar.querySelector('b').textContent = done + ' of ' + all + ' done';
      bar.querySelector('.pbar i').style.width = (all ? Math.round(done * 100 / all) : 0) + '%';
    };
    var store = function () {
      var out = {};
      [].forEach.call(secs, function (s) { var on = []; [].forEach.call(s.querySelectorAll('input.tick'), function (x, i) { if (x.checked) on.push(i); }); if (on.length) out[s.id] = on; });
      try { localStorage.setItem(key, JSON.stringify(out)); } catch (e) { /* private window: ticks last until the page is closed */ }
    };
    [].forEach.call(secs, function (s) {
      var mine = saved[s.id];
      [].forEach.call(s.querySelectorAll('input.tick'), function (x, i) {
        x.disabled = false;
        if (mine) x.checked = mine.indexOf(i) >= 0;
        x.addEventListener('change', function () { store(); count(); });
      });
    });
    var bar = document.createElement('div'); bar.className = 'tickbar no-print';
    bar.innerHTML = '<div class="pbar"><i></i></div><b></b><span class="sp"></span><button type="button" class="btn-lite" data-print>Print</button><button type="button" class="btn-lite" data-clear>Clear my ticks</button>';
    bar.querySelector('[data-print]').onclick = function () { window.print(); };
    bar.querySelector('[data-clear]').onclick = function () {
      if (!confirm('Clear all your ticks on this page?')) return;
      [].forEach.call(boxes, function (x) { x.checked = false; }); store(); count();
    };
    head.appendChild(bar);
    count();
  }

  // search: hides blocks, cards, tables and terms that do not contain every word typed
  $('#q').addEventListener('input', function () {
    var words = this.value.toLowerCase().split(/\s+/).filter(Boolean);
    var has = function (el) { var t = (el.getAttribute('data-search') || el.textContent).toLowerCase(); return words.every(function (w) { return t.indexOf(w) >= 0; }); };
    var toggle = function (el, show) { el.classList.toggle('hidden-by-search', !show); return show; };
    [].forEach.call(document.querySelectorAll('#main > section'), function (s) {
      if (!words.length) { [].forEach.call(s.querySelectorAll('.hidden-by-search'), function (x) { x.classList.remove('hidden-by-search'); }); toggle(s, true); return; }
      // generated parts and card groups are filtered card by card; text parts (also with code in them) as a whole
      var parts = s.classList.contains('block-text') ? [] : s.querySelectorAll('.fcard, .tcard, .term, .enumcard, .flow, .query');
      if (parts.length) {
        var any = false;
        [].forEach.call(parts, function (p) { if (toggle(p, has(p))) any = true; });
        [].forEach.call(s.querySelectorAll('.domain, .tgroup'), function (g) { toggle(g, !!g.querySelector('.tcard:not(.hidden-by-search), .term:not(.hidden-by-search)')); });
        toggle(s, any || has(s.querySelector('.dhead') || s));
      } else if (toggle(s, has(s))) {
        // tables: when some rows match, show only those rows (and hide the tables with none)
        var rows = s.querySelectorAll('.prose table tbody tr'), wraps = s.querySelectorAll('.prose .tscroll');
        var hit = [].some.call(rows, has);
        [].forEach.call(rows, function (r) { toggle(r, !hit || has(r)); });
        [].forEach.call(wraps, function (w) { toggle(w, !hit || !!w.querySelector('tbody tr:not(.hidden-by-search)')); });
      }
    });
    // the menu follows the search: only matching parts, their groups opened
    [].forEach.call(document.querySelectorAll('#toc a'), function (a) {
      var sec = document.querySelector('#main > section[id="' + CSS.escape(a.getAttribute('href').slice(1)) + '"]');
      a.classList.toggle('hidden-by-search', !!(words.length && sec && sec.classList.contains('hidden-by-search')));
    });
    [].forEach.call(document.querySelectorAll('#toc details'), function (g) {
      var any = !!g.querySelector('a:not(.hidden-by-search)');
      g.classList.toggle('hidden-by-search', !any);
      if (words.length && any) g.open = true;
    });
  });
})();
</script>
</body>
</html>
